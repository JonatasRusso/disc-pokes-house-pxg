# Stack de observabilidade do DiscBot: Prometheus + Grafana + postgres_exporter.
# Uso: cp .env.example .env && (edite) && docker compose up -d
# Grafana em http://localhost:3000 (admin / GF_ADMIN_PASSWORD), já com o dashboard provisionado.
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: discbot-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: discbot-postgres-exporter
    environment:
      # Postgres do Railway (ou local). Ex.: postgresql://user:pass@host:5432/db?sslmode=require
      DATA_SOURCE_NAME: ${PG_DSN}
      # Queries extras (ex.: pg_stat_activity_count p/ o painel "Active sessions" do 9628)
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/queries.yaml
    volumes:
      - ./postgres-exporter/queries.yaml:/etc/queries.yaml:ro
    ports:
      - "9187:9187"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: discbot-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GF_PORT:-3000}:3000"   # troque a porta do host via GF_PORT no .env se a 3000 estiver ocupada
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
