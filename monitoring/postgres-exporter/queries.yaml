# Queries extras para o postgres_exporter expor métricas que o exporter moderno não
# traz por padrão, mas que dashboards como o 9628 ("PostgreSQL Database") esperam.
# Carregado via PG_EXPORTER_EXTEND_QUERY_PATH (ver docker-compose.yml).

# Sessões por estado -> métrica pg_stat_activity_count{datname,state} (painel "Active sessions")
pg_stat_activity:
  query: |
    SELECT
      pg_database.datname,
      tmp.state,
      COALESCE(count, 0) AS count,
      COALESCE(max_tx_duration, 0) AS max_tx_duration
    FROM
      (VALUES ('active'),
              ('idle'),
              ('idle in transaction'),
              ('idle in transaction (aborted)'),
              ('fastpath function call'),
              ('disabled')) AS tmp(state)
      CROSS JOIN pg_database
      LEFT JOIN (
        SELECT datname, state, count(*) AS count,
               MAX(extract(EPOCH FROM (now() - xact_start)))::float AS max_tx_duration
        FROM pg_stat_activity
        GROUP BY datname, state
      ) AS s ON tmp.state = s.state AND pg_database.datname = s.datname
  metrics:
    - datname:
        usage: "LABEL"
        description: "Nome do banco"
    - state:
        usage: "LABEL"
        description: "Estado da conexão"
    - count:
        usage: "GAUGE"
        description: "Número de conexões nesse estado"
    - max_tx_duration:
        usage: "GAUGE"
        description: "Duração (s) da transação ativa mais longa nesse estado"
